[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physicalrsi"
version = "0.3.0"
description = "Composable embodied capabilities and persistent self-improvement"
requires-python = ">=3.11"
dependencies = ["rich>=13,<15", "prompt-toolkit>=3,<4", "jsonschema>=4.23,<5"]

[project.scripts]
physicalrsi = "physicalrsi.cli:main"

[project.optional-dependencies]
gym = ["gymnasium>=0.29,<2"]
vision = ["numpy>=1.26,<3", "Pillow>=10,<13"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["PhysicalRSI*", "physicalrsi*"]
exclude = ["tests", "tests.*", "examples", "examples.*", "*.__pycache__", "*.__pycache__.*"]

[tool.setuptools.package-data]
"PhysicalRSI.cli" = ["assets/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
