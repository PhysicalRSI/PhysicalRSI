[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physicalrsi"
version = "0.2.0"
description = "Composable embodied capabilities and persistent self-improvement"
requires-python = ">=3.11"
dependencies = ["rich>=13,<15", "prompt-toolkit>=3,<4", "jsonschema>=4.23,<5"]

[project.scripts]
physicalrsi = "PhysicalRSI.cli:main"

[project.optional-dependencies]
runtime = ["numpy>=1.26,<3"]
mujoco = ["mujoco>=3.3,<4"]
robodojo = ["numpy>=1.26,<3", "shapely>=2,<3", "pyyaml>=6,<7", "Pillow>=10,<13"]
mcp = ["mcp>=1.23,<2"]
dataset = ["numpy>=1.26,<3", "lerobot>=0.3.3,<0.4"]
dexjoco = ["numpy>=1.26,<3", "Pillow>=10,<13", "zarr>=2.18,<3", "numcodecs>=0.12,<0.16"]
test = ["pytest>=8,<10", "numpy>=1.26,<3", "Pillow>=10,<12", "scipy>=1.11,<2"]

[tool.setuptools.packages.find]
include = ["PhysicalRSI*", "examples*"]
exclude = ["PhysicalRSI_baselines.robodojo.XPolicyLab*", "PhysicalRSI_baselines.robodojo.releases*"]

[tool.setuptools.package-data]
"PhysicalRSI_Autoresearch" = ["*.md", "*.json"]
"PhysicalRSI_baselines.opentrons_liquid_handling" = ["README.md"]
"PhysicalRSI.cli" = ["assets/*"]
"PhysicalRSI_demos.showcase" = ["web/*"]
"PhysicalRSI_demos" = ["media/*", "piano_skill_library/**/*.json", "piano_skill_library/**/*.md", "piano_skill_library/*.md", "piano_skill_library/*.json", "mujoco_models/*.xml"]
"PhysicalRSI_baselines.robodojo" = ["configs/*.json", "provenance.json", "releases/robodojo-v1/*", "releases/robodojo-v1/**/*"]
"PhysicalRSI_baselines.robodojo.skills" = ["README.md", "NOTICE.md", "LICENSE.*"]
"PhysicalRSI_baselines.robodojo.xpolicylab_policy" = ["*.sh", "*.yml", "README.md"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
